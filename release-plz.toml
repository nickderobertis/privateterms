# Conventional Commits determine versions; release-plz writes the version, the changelog
# and the tag. It publishes nothing itself: the Release it cuts fires
# .github/workflows/release.yml, whose `publish` job publishes the crate (`just release`).
[workspace]
publish = false
semver_check = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
# Pre-1.0, a `feat` is a minor release and a `fix` a patch.
features_always_increment_minor = true
# Only a merged release pull request is tagged, so the first release (0.1.0, the version
# the manifest starts at) goes out through a release pull request carrying its changelog
# rather than on the merge that introduced the crate.
release_always = false
# Restrict release pull requests to release-worthy commits; without this, release-plz
# considers its own `chore: release` commit eligible and auto-merge loops.
release_commits = "(?s)^(feat|fix|perf)(\\([^)]+\\))?!?:|BREAKING CHANGE:"

[[package]]
name = "privateterms"
changelog_path = "CHANGELOG.md"

[changelog]
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^(test|ci|chore|build|style)", skip = true },
  { message = ".*", skip = true },
]
