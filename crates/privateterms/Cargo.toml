[package]
name = "privateterms"
version = "0.1.0"
description = "The Rust SDK of the private-terms specification: declare private terms, then detect, replace or reject them in public text."
readme = "README.md"
keywords = ["privacy", "redaction", "terms", "boundary", "unicode"]
categories = ["text-processing"]
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# The conformance suite is part of what this crate is tested against, but it is not
# shipped: a consumer depends on the crate, and the cases live in the repository.
include = ["src/**/*.rs", "README.md", "Cargo.toml"]

[dependencies]
aho-corasick = { workspace = true }
icu_normalizer = { workspace = true }
icu_properties = { workspace = true }
schemars = { workspace = true }
serde = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[lints.rust]
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
