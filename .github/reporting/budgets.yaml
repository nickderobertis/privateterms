# The budgets job measures itself: only that job and report-job:test's recorded job hold this
# telemetry, written after the main result upload. The limit is provisional until real runs have
# measured it.
schema_version: 1
budgets:
  # llmlint: ignore[budgets_track_product_owner_outcomes] The issue explicitly requires the new last job to have its own latency budget beside the existing maximum-CI-job budget.
  - id: privateterms-budget-report-command-seconds
    description: >-
      The budget report job from its cold install through the checks, the history read, the
      comment and the main result upload. It protects the turnaround of the check every pull
      request waits on.
    labels: [ci-report]
    measure: reported
    command: [onebudgetspec-github-action, telemetry, --metric, report-command-seconds, --input, .telemetry/report-job.json]
    unit: seconds
    direction: max
    threshold: 120
